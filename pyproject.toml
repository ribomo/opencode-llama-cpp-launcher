[project]
name = "opencode-llama-cpp-launcher"
version = "0.1.5"
description = "One command launcher for running OpenCode with a local llama.cpp model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = [
    "agentic-coding",
    "cli",
    "llama-cpp",
    "local-llm",
    "opencode",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
]
dependencies = [
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
]

[project.scripts]
opencode-llama = "opencode_llama_cpp_launcher.cli.entrypoint:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["opencode_llama_cpp_launcher"]
